<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Mapa estilizado conceitual de Vice City">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0612"/>
      <stop offset="0.55" stop-color="#17082E"/>
      <stop offset="1" stop-color="#2A0A4A"/>
    </linearGradient>
    <linearGradient id="neonRoute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset="0.5" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#14E0D0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#14E0D0" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#ocean)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <!-- Everglades & Mainland West -->
  <path d="M 40 90 Q 220 70 330 140 T 450 340 Q 430 530 290 610 L 60 630 Z" fill="#12282B" stroke="#14E0D0" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Port & Downtown Peninsula -->
  <path d="M 490 120 Q 640 100 710 190 L 730 430 Q 670 550 530 530 L 470 360 Z" fill="#1F0B3A" stroke="#FF7A1A" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Ocean Strip Barrier Island -->
  <path d="M 830 85 Q 940 110 960 280 T 910 595 Q 845 615 815 520 L 800 230 Z" fill="#2A0A4A" stroke="#FF2E88" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Causeways / Bridges -->
  <path d="M 330 270 L 495 250 M 440 430 L 515 430 M 720 240 L 815 240 M 725 415 L 820 440" stroke="url(#neonRoute)" stroke-width="4" stroke-dasharray="10 6" filter="url(#glow)"/>
  <!-- Highway loop -->
  <path d="M 190 520 Q 320 320 600 280 T 885 210 L 875 510" fill="none" stroke="url(#neonRoute)" stroke-width="3.5" filter="url(#glow)"/>
  <!-- Region Pins -->
  <g filter="url(#glow)">
    <circle cx="885" cy="310" r="11" fill="#FF2E88"/>
    <circle cx="885" cy="310" r="22" fill="none" stroke="#FF2E88" stroke-width="2"/>
    <circle cx="230" cy="370" r="11" fill="#14E0D0"/>
    <circle cx="230" cy="370" r="22" fill="none" stroke="#14E0D0" stroke-width="2"/>
    <circle cx="570" cy="465" r="11" fill="#FF7A1A"/>
    <circle cx="570" cy="465" r="22" fill="none" stroke="#FF7A1A" stroke-width="2"/>
    <circle cx="615" cy="235" r="11" fill="#FFF4E6"/>
    <circle cx="615" cy="235" r="22" fill="none" stroke="#FFF4E6" stroke-width="2"/>
  </g>
</svg>
